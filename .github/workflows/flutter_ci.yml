name: NeRuWallet CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache FRB Codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-frb-2.12.0

      - name: Install & Generate Bindings
        run: |
          if [ "${{ steps.cache-frb.outputs.cache-hit }}" != "true" ]; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0
          fi
          
          flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen generate --rust-input crate::api --rust-root rust_signer --dart-output lib/src/rust/
          
          # Setup environment variables
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy-key' }}" >> .env
          
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        run: flutter test

  build-android:
    name: Build Android Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache FRB Codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-frb-2.12.0

      - name: Install & Generate Bindings
        run: |
          if [ "${{ steps.cache-frb.outputs.cache-hit }}" != "true" ]; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0
          fi
          
          flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen generate --rust-input crate::api --rust-root rust_signer --dart-output lib/src/rust/ --c-output ios/Runner/frb.h
          
          # Setup environment variables
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy-key' }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '' }}" >> .env
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY || '' }}" >> .env
          echo "ENCRYPTION_IV=${{ secrets.ENCRYPTION_IV || '' }}" >> .env
          
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeRuWallet-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90

  build-ios:
    name: Build iOS App Bundle & IPA
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Cache FRB Codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-frb-2.12.0

      - name: Install & Generate Bindings
        run: |
          if [ "${{ steps.cache-frb.outputs.cache-hit }}" != "true" ]; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0
          fi
          
          flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen generate --rust-input crate::api --rust-root rust_signer --dart-output lib/src/rust/ --c-output ios/Runner/frb.h
          
          # Setup environment variables
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy-key' }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || '' }}" >> .env
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY || '' }}" >> .env
          echo "ENCRYPTION_IV=${{ secrets.ENCRYPTION_IV || '' }}" >> .env
          
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Rust Library for iOS
        run: |
          cd rust_signer
          # Build for physical device and simulator
          cargo build --target aarch64-apple-ios
          cargo build --target x86_64-apple-ios
          
          # Create universal library for Xcode
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-ios/debug/librust_signer.a \
            target/x86_64-apple-ios/debug/librust_signer.a \
            -output target/universal/librust_signer.a
          cd ..

      - name: Build iOS App Bundle
        run: flutter build ios --debug --no-codesign

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/NeRuWallet.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeRuWallet-iOS-IPA
          path: build/ios/ipa/NeRuWallet.ipa
          retention-days: 90

  create_release:
    name: Create GitHub Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NeRuWallet-Debug-APK
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: NeRuWallet-iOS-IPA
          path: artifacts/ios

      - name: Prepare Release Files
        run: |
          mv artifacts/android/app-debug.apk NeRuWallet-Android.apk
          mv artifacts/ios/NeRuWallet.ipa NeRuWallet-iOS.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NeRuWallet Latest Build"
          body: |
            ## 🚀 Latest Build Summary
            
            This release contains the latest automated builds from the `main` branch.
            
            ### 📦 Artifacts
            - **Android**: `NeRuWallet-Android.apk` (Debug Build)
            - **iOS**: `NeRuWallet-iOS.ipa` (Unsigned Build - for BrowserStack/Simulation)
            
            *Last updated: ${{ github.event.head_commit.timestamp }}*
            *Commit: ${{ github.sha }}*
          files: |
            NeRuWallet-Android.apk
            NeRuWallet-iOS.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
