name: NeRuWallet Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache FRB Codegen
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-frb-2.12.0

      - name: Install & Generate Bindings
        run: |
          if [ "${{ steps.cache-frb.outputs.cache-hit }}" != "true" ]; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0
          fi
          
          flutter pub get
          ~/.cargo/bin/flutter_rust_bridge_codegen generate --rust-input crate::api --rust-root rust_signer --dart-output lib/src/rust/
          
          # Setup environment variables (Use GitHub Secrets for real keys)
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy-key' }}" >> .env
          
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: |
          # The NDK version is usually pre-installed on ubuntu-latest. 
          # We point to it so the Rust plugin can find it.
          echo "ndk.dir=$ANDROID_HOME/ndk-bundle" > android/local.properties
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## Automated Release
            This release contains the latest APK build for NeRuWallet.
            
            **Build Info:**
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Date: $(date +'%Y-%m-%d %H:%M:%S')
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
