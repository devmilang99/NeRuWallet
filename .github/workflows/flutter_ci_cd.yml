name: NeRuWallet CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=https://dummy-project.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy-anon-key" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs
        timeout-minutes: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, aarch64-linux-android, x86_64-linux-android

      # Cache the Rust build (including the uniffi-bindgen bin target) so
      # you don't rebuild it from scratch on every run.
      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_signer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # NOTE: uniffi-bindgen is now built from YOUR crate via its local [[bin]]
      # target (see Cargo.toml + the src/bin/uniffi-bindgen.rs wrapper), so it
      # always matches the uniffi version pinned in your Cargo.lock.
      # Your scripts now invoke it as:
      #
      #   cargo run --bin uniffi-bindgen -- generate ...

      - name: Build Rust library for iOS
        run: |
          chmod +x ios/build_rust_ios.sh
          ./ios/build_rust_ios.sh
        timeout-minutes: 20

      - name: Run Tests
        run: flutter test

      - name: Build iOS
        run: flutter build ios --no-codesign --release
        timeout-minutes: 30

      - name: Build Android APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
        timeout-minutes: 20

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: build/app/outputs/flutter-apk/app-release.apk
          body: "This release contains the latest automated APK build from the main branch."
          prerelease: false
          make_latest: true
